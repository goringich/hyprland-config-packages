name: hyprland-vpn-first-ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: |
          bash -n bin/apply-vpn-first-workspaces.sh
          bash -n hypr/UserScripts/VpnFirstStartup.sh
      - name: Run isolated startup tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
